name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblldb-dev \
            libffi-dev \
            libreadline-dev \
            libdb5.3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libice-dev \
            libsm-dev \
            libjpeg-dev \
            cython3 \
            ffmpeg \
            zip \
            unzip

      - name: Install Python tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      # Android SDK ライセンスを事前に一括自動同意するステップ
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        env:
          # Runner プリインストールの NDK(v27系) とのパス干渉を防止
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_PATH: ""
          # SDK ライセンスの自動受け入れ指示
          ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        run: |
          # buildozer 実行時のライセンス問い合わせにも自動応答（yes）
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PapaAlbum-debug-apk
          path: bin/*.apk