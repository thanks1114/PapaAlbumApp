name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblldb-dev \
            libffi-dev \
            libreadline-dev \
            libdb5.3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libice-dev \
            libsm-dev \
            libjpeg-dev \
            ffmpeg \
            zip \
            unzip \
            wget

      - name: Install Python tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      # Android Command-line Tools のセットアップと互換エイリアス(tools)の作成
      - name: Setup Android SDK Command-line Tools
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # Buildozer/p4a の旧パス判定(android-sdk/tools/bin/sdkmanager)を通過させるシンボリックリンク
          cd ~/.buildozer/android/platform/android-sdk
          ln -s cmdline-tools/latest tools
          
          # SDKライセンスに一括事前同意
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true

      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_PATH: ""
          ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PapaAlbum-debug-apk
          path: bin/*.apk